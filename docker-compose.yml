version: "3.8"

# MYP 商城直播系统 - 本地一键部署
# 启动: docker compose up -d
# 前台: http://localhost:8080   后台: http://localhost:8080/wp-admin
# phpMyAdmin: http://localhost:8081
# SRS 控制台: http://localhost:8082

services:
  db:
    image: mysql:5.7
    container_name: myp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myp_shop
      MYSQL_USER: myp_shop
      MYSQL_PASSWORD: myp_shop_pwd
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  wordpress:
    image: wordpress:php8.0-apache
    container_name: myp-wp
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: myp_shop
      WORDPRESS_DB_USER: myp_shop
      WORDPRESS_DB_PASSWORD: myp_shop_pwd
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ./myp-core:/var/www/html/wp-content/plugins/myp-core
      - ./myp-theme:/var/www/html/wp-content/themes/myp-theme
      - wp_uploads:/var/www/html/wp-content/uploads

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myp-pma
    restart: always
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

  srs:
    image: ossrs/srs:5
    container_name: myp-srs
    restart: always
    ports:
      - "1935:1935"
      - "8082:8080"
      - "1985:1985"

volumes:
  db_data:
  wp_uploads:
